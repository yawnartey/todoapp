{% include 'layout.html' %}

<div class="container">
  <div class="card">
    <div class="card-header">
      Let's edit your todo!
    </div>
    <div class="card-body">
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      
      <form method="POST" action="/todos/edit/{{todo.id}}">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-control" name="title" value="{{todo.title}}" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" class="form-control" rows="3" required>{{todo.description}}</textarea>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select name="priority" class="form-control" required>
            <option value="1" {% if todo.priority == 1 %} selected {% endif %}>1</option>
            <option value="2" {% if todo.priority == 2 %} selected {% endif %}>2</option>
            <option value="3" {% if todo.priority == 3 %} selected {% endif %}>3</option>
            <option value="4" {% if todo.priority == 4 %} selected {% endif %}>4</option>
            <option value="5" {% if todo.priority == 5 %} selected {% endif %}>5</option>
          </select>
        </div>
        <div class="form-group form-check">
          <input type="checkbox" class="form-check-input" name="complete" value="true" {% if todo.complete %} checked {% endif %}>
          <label class="form-check-label">Complete</label>
        </div>
        <button type="submit" class="btn btn-primary">Done</button>
        <a href="/todos" class="btn btn-success">Back</a>
      </form>
      
      <!-- Separate DELETE form -->
      <form method="POST" action="/todos/delete/{{todo.id}}" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this todo?')">
        <input type="hidden" name="_method" value="DELETE">
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
</div>
